<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#8c6aff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MixStil</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const localDev = ['localhost', '127.0.0.1'].includes(window.location.hostname)
          && window.location.port === '5174';
        const recoveryKey = 'snooze-dev-service-worker-cleanup-v1';
        if (!localDev || !('serviceWorker' in navigator) || sessionStorage.getItem(recoveryKey)) return;
        Promise.all([
          navigator.serviceWorker.getRegistrations().then((registrations) => Promise.all(registrations.map((registration) => registration.unregister()))),
          'caches' in window
            ? caches.keys().then((keys) => Promise.all(keys.filter((key) => key.startsWith('snooze-app-shell-')).map((key) => caches.delete(key))))
            : Promise.resolve(),
        ]).then(() => {
          sessionStorage.setItem(recoveryKey, 'done');
          if (navigator.serviceWorker.controller) window.location.reload();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
